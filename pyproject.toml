[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tennisdash"
version = "1.0.0"
description = "Sports-Dash: a calibrated ATP/WTA tennis match prediction engine and dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pyarrow>=15.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "joblib>=1.3",
]

[project.scripts]
tennisdash = "tennisdash.cli:main"

[tool.setuptools.packages.find]
include = ["tennisdash*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
